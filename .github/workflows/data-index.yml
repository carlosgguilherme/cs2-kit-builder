name: Data release (color index)

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data-pipeline/requirements.txt
      - name: Cache skin images
        uses: actions/cache@v4
        with:
          path: data-pipeline/.cache/images
          key: skin-images-${{ github.run_id }}
          restore-keys: skin-images-
      - name: Build color index
        run: python data-pipeline/build_color_index.py --out out/color-index.json --cache data-pipeline/.cache/images
      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y%m%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/color-index.json --clobber
          else
            gh release create "$tag" out/color-index.json --prerelease \
              --title "Color index $(date -u +%Y-%m-%d)" \
              --notes "Generated by data-pipeline from the ByMykel/CSGO-API catalog."
          fi
