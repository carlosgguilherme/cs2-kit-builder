name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build windows/KitBuilder.slnx -c Release
      - name: Test (no network; recorded responses only)
        run: dotnet test windows/KitBuilder.slnx -c Release --no-build --logger "console;verbosity=normal"

  app:
    name: Windows app build (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish app
        run: dotnet publish windows/src/KitBuilder.App/KitBuilder.App.csproj -c Release -p:Platform=x64 -o publish
      - name: Smoke test (the app starts and stays open)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\KitBuilder\logs\app.log"
          $p = Write-Host "Resource files: $((Get-ChildItem publish -Filter *.pri).Name -join ", ")"
          $p = Start-Process -FilePath publish\KitBuilder.App.exe -PassThru
          Start-Sleep -Seconds 20
          $failure = $null
          if ($p.HasExited) { $failure = "KitBuilder.App.exe exited with code $($p.ExitCode) (0x$('{0:X8}' -f $p.ExitCode))" }
          else {
            $p.Refresh()
            Write-Host "Running. Main window title: '$($p.MainWindowTitle)', memory: $([math]::Round($p.WorkingSet64 / 1MB)) MB"
            if ([string]::IsNullOrEmpty($p.MainWindowTitle)) { $failure = "No main window was created" }
            Stop-Process -Id $p.Id -Force
          }
          Write-Host "---- app.log ----"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log file)" }
          if ($failure) {
            Write-Host "---- Windows event log ----"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
              Select-Object -First 5 | ForEach-Object { Write-Host $_.ProviderName; Write-Host $_.Message }
            throw $failure
          }
      - uses: actions/upload-artifact@v6
        with:
          name: KitBuilder-win-x64
          path: publish
          retention-days: 14

  pipeline:
    name: Data pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r data-pipeline/requirements.txt
      - run: python -m unittest discover -s data-pipeline/tests -v
